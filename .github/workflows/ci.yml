name: CI — Swift 6 Tests & macOS App Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift 6 Strict Concurrency & macOS App Build
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Report Selected Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run OctoRunnerKit Unit Tests (TDD Suite)
        run: swift test --package-path Packages/OctoRunnerKit --no-parallel --enable-code-coverage

      - name: Preserve Swift Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage-xcode-27
          path: Packages/OctoRunnerKit/.build/**/codecov/*.json
          include-hidden-files: true
          retention-days: 14

      - name: Test Release Signing Pipeline
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Generate App Icons & Xcode Project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift scripts/generate-app-icons.swift
          xcodegen generate

      - name: Build OctoRunner.app (Release)
        run: |
          xcodebuild -project OctoRunner.xcodeproj \
            -scheme OctoRunner \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Test Settings Navigation in the App
        run: |
          xcodebuild -project OctoRunner.xcodeproj \
            -scheme OctoRunner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData/UITests \
            -resultBundlePath DerivedData/SettingsUITests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test

      - name: Preserve Settings UI Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-ui-tests-xcode-27
          path: DerivedData/SettingsUITests.xcresult
          retention-days: 7
