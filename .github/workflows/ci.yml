name: CI — Swift 6 Tests & macOS App Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift 6 Strict Concurrency & macOS App Build
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run OctoRunnerKit Unit Tests (TDD Suite)
        run: swift test --package-path Packages/OctoRunnerKit --no-parallel

      - name: Test Release Signing Pipeline
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Generate App Icons & Xcode Project
        run: |
          brew list xcodegen || brew install xcodegen
          swift scripts/generate-app-icons.swift
          xcodegen generate

      - name: Build OctoRunner.app (Release)
        run: |
          xcodebuild -project OctoRunner.xcodeproj \
            -scheme OctoRunner \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build
