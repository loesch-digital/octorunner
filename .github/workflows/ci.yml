name: CI — Swift 6 Tests & macOS App Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      website_only: ${{ steps.scope.outputs.website_only }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect website-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Pull requests check out GitHub's merge commit, so compare its
          # changes against the base. Pushes compare the full pushed range.
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "website_only=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet --no-renames "$BASE_SHA" "$GITHUB_SHA" -- . \
            ':(exclude)website/**' ':(exclude)docs/DESIGN.md' \
            ':(exclude)docs/assets/app-screens/dashboard.png' ':(exclude)scripts/stage-website.py' \
            ':(exclude).github/workflows/website.yml' ':(exclude)scripts/tests/test_website.py'; then
            echo "website_only=true" >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 1 ]]; then exit "$result"; fi
            echo "website_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate website-only changes for the required check
        if: steps.scope.outputs.website_only == 'true'
        run: python3 -m unittest discover -s scripts/tests -p test_website.py

  build-and-test:
    name: Build and test the macOS app
    needs: scope
    if: needs.scope.outputs.website_only == 'false'
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Report Selected Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run OctoRunnerKit Unit Tests (TDD Suite)
        run: python3 scripts/run-swift-tests.py -- swift test --package-path Packages/OctoRunnerKit --no-parallel --enable-code-coverage

      - name: Preserve Swift Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage-xcode-27
          path: Packages/OctoRunnerKit/.build/**/codecov/*.json
          include-hidden-files: true
          retention-days: 14

      - name: Preserve Swift Test Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-test-diagnostics
          path: DerivedData/SwiftTestDiagnostics
          retention-days: 14

      - name: Test Release Signing Pipeline
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Generate App Icons & Xcode Project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          swift scripts/generate-app-icons.swift
          xcodegen generate

      - name: Build OctoRunner.app (Release)
        run: |
          xcodebuild -project OctoRunner.xcodeproj \
            -scheme OctoRunner \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Test Settings Navigation in the App
        run: |
          xcodebuild -project OctoRunner.xcodeproj \
            -scheme OctoRunner \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData/UITests \
            -resultBundlePath DerivedData/SettingsUITests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            test

      - name: Preserve Settings UI Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-ui-tests-xcode-27
          path: DerivedData/SettingsUITests.xcresult
          retention-days: 7

  required-check:
    name: Swift 6 Strict Concurrency & macOS App Build
    needs: [scope, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the required app checks
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          WEBSITE_ONLY: ${{ needs.scope.outputs.website_only }}
          APP_RESULT: ${{ needs.build-and-test.result }}
        run: |
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          if [[ "$WEBSITE_ONLY" == true && "$APP_RESULT" == skipped ]]; then
            echo "Website-only changes. The macOS build was skipped."
          else
            [[ "$APP_RESULT" == success ]]
          fi
