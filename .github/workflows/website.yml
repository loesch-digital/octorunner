name: Website — Validate & Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/assets/app-screens/dashboard.png'
      - 'scripts/stage-website.py'
      - 'README.md'
      - 'scripts/tests/test_website.py'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/assets/app-screens/dashboard.png'
      - 'scripts/stage-website.py'
      - 'README.md'
      - 'scripts/tests/test_website.py'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check local links and assets
        run: python3 -m unittest discover -s scripts/tests -p test_website.py

      - name: Stage public website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/stage-website.py "$RUNNER_TEMP/octorunner-pages"

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/octorunner-pages

  deploy:
    name: Deploy website to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
