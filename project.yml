name: OctoRunner
options:
  bundleIdPrefix: io.octorunner
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.2"
packages:
  OctoRunnerKit:
    path: Packages/OctoRunnerKit
targets:
  OctoRunner:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: LICENSE
        buildPhase: resources
      - path: BackgroundAgent/io.octorunner.macos.background.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: OctoRunner
        PRODUCT_BUNDLE_IDENTIFIER: io.octorunner.macos
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/OctoRunner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 loesch-digital. Licensed under the Apache License, Version 2.0."
    dependencies:
      - target: OctoRunnerBackgroundMonitor
        embed: true
        link: false
        copy:
          destination: executables
      - package: OctoRunnerKit
        product: CoreModels
      - package: OctoRunnerKit
        product: DesignSystem
      - package: OctoRunnerKit
        product: SecurityKit
      - package: OctoRunnerKit
        product: GitHubAPI
      - package: OctoRunnerKit
        product: RunnerEngine
      - package: OctoRunnerKit
        product: SyncKit
      - package: OctoRunnerKit
        product: TelemetryKit
      - package: OctoRunnerKit
        product: AppShellFeature
  OctoRunnerBackgroundMonitor:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Packages/OctoRunnerKit/Sources/BackgroundMonitorAgent
    dependencies:
      - package: OctoRunnerKit
        product: BackgroundMonitoringKit
    settings:
      base:
        PRODUCT_NAME: OctoRunnerBackgroundMonitor
        PRODUCT_BUNDLE_IDENTIFIER: io.octorunner.macos.background
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  OctoRunnerUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/OctoRunnerUITests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: OctoRunner
schemes:
  OctoRunner:
    build:
      targets:
        OctoRunner: all
    test:
      targets:
        - OctoRunnerUITests
