name: OctoRunner
options:
  bundleIdPrefix: io.octorunner
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
packages:
  OctoRunnerKit:
    path: Packages/OctoRunnerKit
targets:
  OctoRunner:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: OctoRunner
        PRODUCT_BUNDLE_IDENTIFIER: io.octorunner.macos
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/OctoRunner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 loesch-digital. All rights reserved."
    dependencies:
      - package: OctoRunnerKit
        product: CoreModels
      - package: OctoRunnerKit
        product: DesignSystem
      - package: OctoRunnerKit
        product: SecurityKit
      - package: OctoRunnerKit
        product: GitHubAPI
      - package: OctoRunnerKit
        product: RunnerEngine
      - package: OctoRunnerKit
        product: TelemetryKit
      - package: OctoRunnerKit
        product: AppShellFeature
